steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lifeforge-ai:latest"
      - "."

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lifeforge-ai:latest"

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

timeout: "1200s"
